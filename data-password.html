<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Data Password Generator</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        padding: 20px;
      }

      .container {
        background: rgba(255, 255, 255, 0.95);
        padding: 40px;
        border-radius: 12px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        width: 100%;
        max-width: 600px;
        backdrop-filter: blur(10px);
      }

      .back-button {
        position: absolute;
        top: 20px;
        left: 20px;
        padding: 10px 20px;
        background: rgba(255, 255, 255, 0.9);
        color: #667eea;
        border: 2px solid #667eea;
        border-radius: 8px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        text-decoration: none;
      }

      .back-button:hover {
        background: #667eea;
        color: white;
        transform: translateY(-2px);
      }

      h1 {
        font-size: 28px;
        font-weight: 600;
        color: #1a1a1a;
        margin-bottom: 12px;
        text-align: center;
        letter-spacing: -0.5px;
      }

      .subtitle {
        text-align: center;
        color: #666;
        margin-bottom: 32px;
        font-size: 14px;
      }

      .form-group {
        margin-bottom: 20px;
      }

      label {
        display: block;
        margin-bottom: 8px;
        color: #333;
        font-weight: 500;
        font-size: 14px;
      }

      input[type="text"],
      input[type="number"],
      select {
        width: 100%;
        padding: 12px 16px;
        border: 2px solid #e0e0e0;
        border-radius: 8px;
        font-size: 15px;
        outline: none;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        background-color: #fafafa;
      }

      input::placeholder {
        color: #999;
      }

      input:focus,
      select:focus {
        background-color: white;
        border-color: #667eea;
        box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
      }

      .checkbox-group {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 8px;
      }

      .checkbox-label {
        display: flex;
        align-items: center;
        gap: 6px;
        cursor: pointer;
        padding: 8px 12px;
        background: #f5f5f5;
        border-radius: 6px;
        transition: all 0.2s;
        font-size: 14px;
      }

      .checkbox-label:hover {
        background: #e8e8e8;
      }

      .checkbox-label input[type="checkbox"] {
        width: auto;
        cursor: pointer;
      }

      button {
        width: 100%;
        padding: 14px;
        margin-top: 28px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        letter-spacing: 0.5px;
      }

      button:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
      }

      button:active {
        transform: translateY(0);
        box-shadow: 0 2px 10px rgba(102, 126, 234, 0.4);
      }

      .results {
        display: none;
        margin-top: 32px;
        padding-top: 32px;
        border-top: 2px solid #e0e0e0;
      }

      .results.active {
        display: block;
      }

      .results h2 {
        font-size: 20px;
        color: #1a1a1a;
        margin-bottom: 20px;
        text-align: center;
      }

      .password-list {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 12px;
      }

      .password-item {
        display: flex;
        flex-direction: column;
        align-items: stretch;
        gap: 10px;
        padding: 14px 16px;
        background: #f8f9ff;
        border: 2px solid #e0e7ff;
        border-radius: 8px;
        transition: all 0.2s;
      }

      .password-item:hover {
        border-color: #667eea;
        background: #f0f4ff;
      }

      .password-text {
        font-family: "Courier New", monospace;
        font-size: 15px;
        color: #333;
        font-weight: 500;
        word-break: break-all;
        text-align: center;
      }

      .copy-button {
        padding: 8px 16px;
        background: #667eea;
        color: white;
        border: none;
        border-radius: 6px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s;
        margin: 0;
        white-space: nowrap;
        width: 100%;
      }

      .copy-button:hover {
        background: #5568d3;
        transform: none;
        box-shadow: none;
      }

      .copy-button.copied {
        background: #4caf50;
      }

      .strength-indicator {
        display: flex;
        gap: 4px;
        margin-top: 4px;
      }

      .strength-bar {
        height: 4px;
        flex: 1;
        background: #e0e0e0;
        border-radius: 2px;
        transition: background 0.3s;
      }

      .strength-bar.active {
        background: #667eea;
      }

      .strength-bar.weak {
        background: #f44336;
      }

      .strength-bar.medium {
        background: #ff9800;
      }

      .strength-bar.strong {
        background: #4caf50;
      }

      .new-generation-button {
        margin-top: 20px;
        background: white;
        color: #667eea;
        border: 2px solid #667eea;
      }

      .new-generation-button:hover {
        background: #667eea;
        color: white;
      }

      @media (max-width: 640px) {
        .container {
          padding: 30px 20px;
        }

        h1 {
          font-size: 24px;
        }

        .password-list {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <a href="index.html" class="back-button">← Back</a>

    <div class="container">
      <h1>Data Password Generator</h1>
      <p class="subtitle">Enter any data to create unique passwords</p>

      <form id="dataForm">
        <div class="form-group">
          <label for="input1">Data 1</label>
          <input
            type="text"
            id="input1"
            placeholder="Enter any word or text"
            required
          />
        </div>

        <div class="form-group">
          <label for="input2">Data 2</label>
          <input
            type="text"
            id="input2"
            placeholder="Enter any word or text"
            required
          />
        </div>

        <div class="form-group">
          <label for="input3">Data 3 (optional)</label>
          <input
            type="text"
            id="input3"
            placeholder="Enter any word, number, or text"
          />
        </div>

        <div class="form-group">
          <label for="input4">Data 4 (optional)</label>
          <input
            type="text"
            id="input4"
            placeholder="Enter any word, number, or text"
          />
        </div>

        <div class="form-group">
          <label for="input5">Data 5 (optional)</label>
          <input
            type="text"
            id="input5"
            placeholder="Enter any word, number, or text"
          />
        </div>

        <div class="form-group">
          <label for="input6">Data 6 (optional)</label>
          <input
            type="text"
            id="input6"
            placeholder="Enter any word, number, or text"
          />
        </div>

        <div class="form-group">
          <label for="input7">Data 7 (optional)</label>
          <input
            type="text"
            id="input7"
            placeholder="Enter any word, number, or text"
          />
        </div>

        <div class="form-group">
          <label>Password Complexity</label>
          <div class="checkbox-group">
            <label class="checkbox-label">
              <input type="checkbox" id="includeSymbols" checked />
              <span>Symbols (!@#$)</span>
            </label>
            <label class="checkbox-label">
              <input type="checkbox" id="includeNumbers" checked />
              <span>Numbers</span>
            </label>
            <label class="checkbox-label">
              <input type="checkbox" id="includeUppercase" checked />
              <span>Uppercase</span>
            </label>
            <label class="checkbox-label">
              <input type="checkbox" id="mixWords" checked />
              <span>Mix Words</span>
            </label>
          </div>
        </div>

        <button type="submit">Generate Passwords</button>
      </form>

      <div class="results" id="results">
        <h2>Your Generated Passwords 🔐</h2>
        <div class="password-list" id="passwordList"></div>
        <button class="new-generation-button" id="regenerateButton">
          Regenerate Passwords
        </button>
        <button
          class="new-generation-button"
          onclick="resetForm()"
          style="
            background: white;
            color: #667eea;
            border: 2px solid #667eea;
            margin-top: 10px;
          "
        >
          Enter New Data
        </button>
      </div>
    </div>

    <script>
      const form = document.getElementById("dataForm");
      const results = document.getElementById("results");
      const passwordList = document.getElementById("passwordList");
      const regenerateButton = document.getElementById("regenerateButton");

      let lastFormData = null;

      // Character sets
      const symbols = "!@#$%^&*-_=+";
      const numbers = "0123456789";

      // Utility functions
      function randomSymbol() {
        return symbols[Math.floor(Math.random() * symbols.length)];
      }

      function randomNumber() {
        return numbers[Math.floor(Math.random() * numbers.length)];
      }

      function calculateStrength(password) {
        let strength = 0;
        if (password.length >= 8) strength++;
        if (password.length >= 12) strength++;
        if (/[A-Z]/.test(password)) strength++;
        if (/[0-9]/.test(password)) strength++;
        if (/[^A-Za-z0-9]/.test(password)) strength++;
        return strength;
      }

      function getStrengthClass(strength) {
        if (strength <= 2) return "weak";
        if (strength <= 3) return "medium";
        return "strong";
      }

      function generatePasswords(data) {
        const passwords = [];
        const {
          input1,
          input2,
          input3,
          input4,
          input5,
          input6,
          input7,
          includeSymbols,
          includeNumbers,
          includeUppercase,
          mixWords,
        } = data;

        // Collect all non-empty inputs
        const inputs = [
          input1,
          input2,
          input3,
          input4,
          input5,
          input6,
          input7,
        ].filter((i) => i && i.trim());

        // Combine all inputs into one string
        let combined = inputs.join("");

        // Generate 8 different password variations
        for (let i = 0; i < 8; i++) {
          let password = "";

          // Shuffle and combine the data
          const shuffled = combined
            .split("")
            .sort(() => Math.random() - 0.5)
            .join("");

          // Take random portions
          const startPos = Math.floor(
            Math.random() * Math.max(1, shuffled.length - 8),
          );
          const length = Math.min(
            shuffled.length,
            Math.floor(Math.random() * 8) + 8,
          );
          password = shuffled.substring(startPos, startPos + length);

          // Apply transformations based on settings
          if (includeUppercase && Math.random() > 0.5) {
            password = password
              .split("")
              .map((char, idx) =>
                Math.random() > 0.5 ? char.toUpperCase() : char.toLowerCase(),
              )
              .join("");
          }

          // Add random numbers if enabled
          if (includeNumbers) {
            const numCount = Math.floor(Math.random() * 3) + 1;
            for (let j = 0; j < numCount; j++) {
              const pos = Math.floor(Math.random() * (password.length + 1));
              password =
                password.slice(0, pos) + randomNumber() + password.slice(pos);
            }
          }

          // Add random symbols if enabled
          if (includeSymbols) {
            const symCount = Math.floor(Math.random() * 2) + 1;
            for (let j = 0; j < symCount; j++) {
              const pos = Math.floor(Math.random() * (password.length + 1));
              password =
                password.slice(0, pos) + randomSymbol() + password.slice(pos);
            }
          }

          passwords.push(password);
        }

        return passwords;
      }

      function displayPasswords(passwords) {
        passwordList.innerHTML = "";

        passwords.forEach((password, index) => {
          const strength = calculateStrength(password);
          const strengthClass = getStrengthClass(strength);

          const item = document.createElement("div");
          item.className = "password-item";

          const passwordText = document.createElement("div");
          passwordText.className = "password-text";
          passwordText.textContent = password;

          const strengthIndicator = document.createElement("div");
          strengthIndicator.className = "strength-indicator";
          for (let i = 0; i < 5; i++) {
            const bar = document.createElement("div");
            bar.className = "strength-bar";
            if (i < strength) {
              bar.classList.add("active", strengthClass);
            }
            strengthIndicator.appendChild(bar);
          }

          const copyBtn = document.createElement("button");
          copyBtn.className = "copy-button";
          copyBtn.textContent = "Copy";
          copyBtn.onclick = function () {
            navigator.clipboard.writeText(password).then(() => {
              copyBtn.textContent = "Copied!";
              copyBtn.classList.add("copied");
              setTimeout(() => {
                copyBtn.textContent = "Copy";
                copyBtn.classList.remove("copied");
              }, 2000);
            });
          };

          item.appendChild(passwordText);
          item.appendChild(strengthIndicator);
          item.appendChild(copyBtn);
          passwordList.appendChild(item);
        });
      }

      form.addEventListener("submit", (e) => {
        e.preventDefault();

        const formData = {
          input1: document.getElementById("input1").value.trim(),
          input2: document.getElementById("input2").value.trim(),
          input3: document.getElementById("input3").value.trim(),
          input4: document.getElementById("input4").value.trim(),
          input5: document.getElementById("input5").value.trim(),
          input6: document.getElementById("input6").value.trim(),
          input7: document.getElementById("input7").value.trim(),
          includeSymbols: document.getElementById("includeSymbols").checked,
          includeNumbers: document.getElementById("includeNumbers").checked,
          includeUppercase: document.getElementById("includeUppercase").checked,
          mixWords: document.getElementById("mixWords").checked,
        };

        lastFormData = formData;
        const passwords = generatePasswords(formData);
        displayPasswords(passwords);

        results.classList.add("active");
        results.scrollIntoView({ behavior: "smooth", block: "nearest" });
      });

      regenerateButton.addEventListener("click", () => {
        if (lastFormData) {
          const passwords = generatePasswords(lastFormData);
          displayPasswords(passwords);
          results.scrollIntoView({ behavior: "smooth", block: "nearest" });
        }
      });

      function resetForm() {
        form.reset();
        results.classList.remove("active");
        window.scrollTo({ top: 0, behavior: "smooth" });
        // Re-check default checkboxes
        document.getElementById("includeSymbols").checked = true;
        document.getElementById("includeNumbers").checked = true;
        document.getElementById("includeUppercase").checked = true;
        document.getElementById("mixWords").checked = true;
      }
    </script>
  </body>
</html>
