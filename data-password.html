<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Generador de Contraseñas con Datos</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        padding: 20px;
      }

      .container {
        background: rgba(255, 255, 255, 0.95);
        padding: 40px;
        border-radius: 12px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        width: 100%;
        max-width: 600px;
        backdrop-filter: blur(10px);
      }

      .back-button {
        position: absolute;
        top: 20px;
        left: 20px;
        padding: 10px 20px;
        background: rgba(255, 255, 255, 0.9);
        color: #667eea;
        border: 2px solid #667eea;
        border-radius: 8px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        text-decoration: none;
      }

      .back-button:hover {
        background: #667eea;
        color: white;
        transform: translateY(-2px);
      }

      h1 {
        font-size: 28px;
        font-weight: 600;
        color: #1a1a1a;
        margin-bottom: 12px;
        text-align: center;
        letter-spacing: -0.5px;
      }

      .subtitle {
        text-align: center;
        color: #666;
        margin-bottom: 32px;
        font-size: 14px;
      }

      .form-group {
        margin-bottom: 20px;
      }

      label {
        display: block;
        margin-bottom: 8px;
        color: #333;
        font-weight: 500;
        font-size: 14px;
      }

      input[type="text"] {
        width: 100%;
        padding: 12px 16px;
        border: 2px solid #e0e0e0;
        border-radius: 8px;
        font-size: 15px;
        outline: none;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        background-color: #fafafa;
      }

      input::placeholder {
        color: #999;
      }

      input:focus {
        background-color: white;
        border-color: #667eea;
        box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
      }

      button {
        width: 100%;
        padding: 14px;
        margin-top: 28px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        letter-spacing: 0.5px;
      }

      button:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
      }

      button:active {
        transform: translateY(0);
        box-shadow: 0 2px 10px rgba(102, 126, 234, 0.4);
      }

      .results {
        display: none;
        margin-top: 32px;
        padding-top: 32px;
        border-top: 2px solid #e0e0e0;
      }

      .results.active {
        display: block;
      }

      .results h2 {
        font-size: 20px;
        color: #1a1a1a;
        margin-bottom: 20px;
        text-align: center;
      }

      .password-list {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 12px;
      }

      .password-item {
        display: flex;
        flex-direction: column;
        align-items: stretch;
        gap: 10px;
        padding: 14px 16px;
        background: #f8f9ff;
        border: 2px solid #e0e7ff;
        border-radius: 8px;
        transition: all 0.2s;
      }

      .password-item:hover {
        border-color: #667eea;
        background: #f0f4ff;
      }

      .password-text {
        font-family: "Courier New", monospace;
        font-size: 15px;
        color: #333;
        font-weight: 500;
        word-break: break-all;
        text-align: center;
      }

      .copy-button {
        padding: 8px 16px;
        background: #667eea;
        color: white;
        border: none;
        border-radius: 6px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s;
        margin: 0;
        white-space: nowrap;
        width: 100%;
      }

      .copy-button:hover {
        background: #5568d3;
        transform: none;
        box-shadow: none;
      }

      .copy-button.copied {
        background: #4caf50;
      }

      .new-generation-button {
        margin-top: 20px;
        background: white;
        color: #667eea;
        border: 2px solid #667eea;
      }

      .new-generation-button:hover {
        background: #667eea;
        color: white;
      }

      @media (max-width: 640px) {
        .container {
          padding: 30px 20px;
        }

        h1 {
          font-size: 24px;
        }

        .password-list {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <a href="index.html" class="back-button">← Volver</a>

    <div class="container">
      <h1>Generador de Contraseñas con Datos</h1>
      <p class="subtitle">Genera contraseñas con combinaciones de datos que ingreses</p>

      <form id="dataForm">
        <div class="form-group">
          <label for="input1">Dato 1</label>
          <input
            type="text"
            id="input1"
            placeholder="Ingresa cualquier palabra o texto"
            required
          />
        </div>

        <div class="form-group">
          <label for="input2">Dato 2</label>
          <input
            type="text"
            id="input2"
            placeholder="Ingresa cualquier palabra o texto"
            required
          />
        </div>

        <div class="form-group">
          <label for="input3">Dato 3 (opcional)</label>
          <input
            type="text"
            id="input3"
            placeholder="Ingresa cualquier palabra, número o texto"
          />
        </div>

        <div class="form-group">
          <label for="input4">Dato 4 (opcional)</label>
          <input
            type="text"
            id="input4"
            placeholder="Ingresa cualquier palabra, número o texto"
          />
        </div>

        <div class="form-group">
          <label for="input5">Dato 5 (opcional)</label>
          <input
            type="text"
            id="input5"
            placeholder="Ingresa cualquier palabra, número o texto"
          />
        </div>

        <div class="form-group">
          <label for="input6">Dato 6 (opcional)</label>
          <input
            type="text"
            id="input6"
            placeholder="Ingresa cualquier palabra, número o texto"
          />
        </div>

        <div class="form-group">
          <label for="input7">Dato 7 (opcional)</label>
          <input
            type="text"
            id="input7"
            placeholder="Ingresa cualquier palabra, número o texto"
          />
        </div>

        <button type="submit">Generar Contraseñas</button>
      </form>

      <div class="results" id="results">
        <h2>Tus Contraseñas Generadas 🔐</h2>
        <div class="password-list" id="passwordList"></div>
        <button class="new-generation-button" id="regenerateButton">
          Regenerar Contraseñas
        </button>
        <button
          class="new-generation-button"
          onclick="resetForm()"
          style="
            background: white;
            color: #667eea;
            border: 2px solid #667eea;
            margin-top: 10px;
          "
        >
          Ingresar Nuevos Datos
        </button>
      </div>
    </div>

    <script>
      const form = document.getElementById("dataForm");
      const results = document.getElementById("results");
      const passwordList = document.getElementById("passwordList");
      const regenerateButton = document.getElementById("regenerateButton");

      let lastFormData = null;

      // Función para generar combinaciones de 2 o 3 datos
      function generateCombinations(inputs) {
        const combinations = [];
        const n = inputs.length;
        
        // Combinaciones de 2 datos
        for (let i = 0; i < n; i++) {
          for (let j = 0; j < n; j++) {
            if (i !== j) {
              combinations.push(inputs[i] + inputs[j]);
            }
          }
        }
        
        // Combinaciones de 3 datos
        for (let i = 0; i < n; i++) {
          for (let j = 0; j < n; j++) {
            for (let k = 0; k < n; k++) {
              if (i !== j && j !== k && i !== k) {
                combinations.push(inputs[i] + inputs[j] + inputs[k]);
              }
            }
          }
        }
        
        return combinations;
      }

      function generatePasswords(data) {
        const {
          input1,
          input2,
          input3,
          input4,
          input5,
          input6,
          input7,
        } = data;

        // Recolectar todas las entradas no vacías
        const inputs = [
          input1,
          input2,
          input3,
          input4,
          input5,
          input6,
          input7,
        ].filter((i) => i && i.trim());

        // Generar todas las combinaciones de 2 o 3 datos
        const passwords = generateCombinations(inputs);
        
        // Limitar a las primeras 8 combinaciones para no saturar la pantalla
        return passwords.slice(0, 8);
      }

      function displayPasswords(passwords) {
        passwordList.innerHTML = "";

        passwords.forEach((password, index) => {
          const item = document.createElement("div");
          item.className = "password-item";

          const passwordText = document.createElement("div");
          passwordText.className = "password-text";
          passwordText.textContent = password;

          const copyBtn = document.createElement("button");
          copyBtn.className = "copy-button";
          copyBtn.textContent = "Copiar";
          copyBtn.onclick = function () {
            navigator.clipboard.writeText(password).then(() => {
              copyBtn.textContent = "¡Copiado!";
              copyBtn.classList.add("copied");
              setTimeout(() => {
                copyBtn.textContent = "Copiar";
                copyBtn.classList.remove("copied");
              }, 2000);
            });
          };

          item.appendChild(passwordText);
          item.appendChild(copyBtn);
          passwordList.appendChild(item);
        });
      }

      form.addEventListener("submit", (e) => {
        e.preventDefault();

        const formData = {
          input1: document.getElementById("input1").value.trim(),
          input2: document.getElementById("input2").value.trim(),
          input3: document.getElementById("input3").value.trim(),
          input4: document.getElementById("input4").value.trim(),
          input5: document.getElementById("input5").value.trim(),
          input6: document.getElementById("input6").value.trim(),
          input7: document.getElementById("input7").value.trim(),
        };

        lastFormData = formData;
        const passwords = generatePasswords(formData);
        displayPasswords(passwords);

        results.classList.add("active");
        results.scrollIntoView({ behavior: "smooth", block: "nearest" });
      });

      regenerateButton.addEventListener("click", () => {
        if (lastFormData) {
          const passwords = generatePasswords(lastFormData);
          displayPasswords(passwords);
          results.scrollIntoView({ behavior: "smooth", block: "nearest" });
        }
      });

      function resetForm() {
        form.reset();
        results.classList.remove("active");
        window.scrollTo({ top: 0, behavior: "smooth" });
      }
    </script>
  </body>
</html>
